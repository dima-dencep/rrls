name: Publish Release

on:
  push:
    branches:
      - '**/stable'
      - '**/backport'
      - '**/snapshot'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Get previous tag
        run: echo "previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_ENV

      - name: Build Changelog
        id: build_changelog
        uses: metcalfc/changelog-generator@v4.6.2
        if: env.previous_tag
        with:
          mytoken: ${{ secrets.GITHUB_TOKEN }}
          base-ref: ${{ env.previous_tag }}
          fetch: false

      - name: Read value from Properties-file
        id: read_property
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: './gradle.properties'
          properties: 'mod_version minecraft_version'

      - name: Build
        run: ./gradlew build
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Publish to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3.0
        id: publish_merged
        with:
          modrinth-id: ZP7xHXtw
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 833233
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-tag: "${{ steps.read_property.outputs.minecraft_version }}-${{ steps.read_property.outputs.mod_version }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-prerelease: false

          files: |
            build/libs/!(*-@(dev|sources|javadoc|shadow|fabric|neoforge)*).jar

          name: "[${{ steps.read_property.outputs.minecraft_version }}] v${{ steps.read_property.outputs.mod_version }}"

          changelog: ${{steps.build_changelog.outputs.changelog}}

          version: "${{ steps.read_property.outputs.mod_version }}+mc${{ steps.read_property.outputs.minecraft_version }}"
          version-type: alpha

          loaders: |
            fabric
            neoforge

          game-version-filter: none
          game-versions: |
            ${{ steps.read_property.outputs.minecraft_version }}

          dependencies: |
            forge-config-api-port(optional){modrinth:ohNO6lps}{curseforge:547434}

          java: |
            25

      - name: Build P2D_LINKS
        shell: bash
        run: |
          {
            echo 'P2D_LINKS<<EOF'

            if [ -n "${{ steps.publish_merged.outputs.modrinth-url }}" ]; then
              echo "Modrinth|${{ steps.publish_merged.outputs.modrinth-url }}|MODRINTH"
            fi
            if [ -n "${{ steps.publish_merged.outputs.curseforge-url }}" ]; then
              echo "CurseForge|${{ steps.publish_merged.outputs.curseforge-url }}|CURSEFORGE"
            fi

            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Discord notify
        run: ./gradlew publishToDiscord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MOD_CHANGELOG: ${{steps.build_changelog.outputs.changelog}}
