name: Publish Release

on:
  push:
    branches:
      - '**/stable'
      - '**/backport'
      - '**/snapshot'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Get previous tag
        run: echo "previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_ENV

      - name: Build Changelog
        id: build_changelog
        uses: metcalfc/changelog-generator@v4.3.1
        if: env.previous_tag
        with:
          mytoken: ${{ secrets.GITHUB_TOKEN }}
          base-ref: ${{ env.previous_tag }}
          fetch: false

      - name: Read value from Properties-file
        id: read_property
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: './gradle.properties'
          properties: 'mod_version minecraft_version'

      - name: Upload assets to releases
        run: ./gradlew build
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Publish Forge to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3.0
        id: publish_forge
        with:
          modrinth-id: ZP7xHXtw
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 833233
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            forge/build/libs/!(*-@(dev|sources|javadoc|shadow)).jar

          name: "[NeoForge ${{ steps.read_property.outputs.minecraft_version }}] v${{ steps.read_property.outputs.mod_version }}"

          changelog: ${{steps.build_changelog.outputs.changelog}}

          version: "${{ steps.read_property.outputs.mod_version }}+mc${{ steps.read_property.outputs.minecraft_version }}-forge"
          version-type: beta

          loaders: |
            neoforge

          game-version-filter: none
          game-versions: |
            ${{ steps.read_property.outputs.minecraft_version }}

          java: |
            21

      - name: Publish Fabric to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3.0
        id: publish_fabric
        with:
          modrinth-id: ZP7xHXtw
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 833233
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          
          files: |
            fabric/build/libs/!(*-@(dev|sources|javadoc|shadow)).jar

          name: "[Fabric ${{ steps.read_property.outputs.minecraft_version }}] v${{ steps.read_property.outputs.mod_version }}"

          changelog: ${{steps.build_changelog.outputs.changelog}}

          version: "${{ steps.read_property.outputs.mod_version }}+mc${{ steps.read_property.outputs.minecraft_version }}-fabric"
          version-type: beta

          loaders: |
            fabric

          game-version-filter: none
          game-versions: |
            ${{ steps.read_property.outputs.minecraft_version }}

          dependencies: |
            forge-config-api-port{modrinth:ohNO6lps}{curseforge:547434}

          java: |
            21

      - name: Publish Fabric & Forge to Github
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          github-tag: "${{ steps.read_property.outputs.minecraft_version }}-${{ steps.read_property.outputs.mod_version }}"

          files: |
            forge/build/libs/!(*-@(dev|sources|javadoc|shadow)).jar
            fabric/build/libs/!(*-@(dev|sources|javadoc|shadow)).jar

          name: "[${{ steps.read_property.outputs.minecraft_version }}] v${{ steps.read_property.outputs.mod_version }}"

          changelog: ${{steps.build_changelog.outputs.changelog}}

          version-type: release

      - name: Build P2D_LINKS
        shell: bash
        run: |
          {
            echo 'P2D_LINKS<<EOF'

            # --- Fabric ---
            if [ -n "${{ steps.publish_fabric.outputs.modrinth-url }}" ]; then
              echo "Fabric (Modrinth)|${{ steps.publish_fabric.outputs.modrinth-url }}|MODRINTH"
            fi
            if [ -n "${{ steps.publish_fabric.outputs.curseforge-url }}" ]; then
              echo "Fabric (CurseForge)|${{ steps.publish_fabric.outputs.curseforge-url }}|CURSEFORGE"
            fi

            echo ""

            # --- NeoForge ---
            if [ -n "${{ steps.publish_forge.outputs.modrinth-url }}" ]; then
              echo "NeoForge (Modrinth)|${{ steps.publish_forge.outputs.modrinth-url }}|MODRINTH"
            fi
            if [ -n "${{ steps.publish_forge.outputs.curseforge-url }}" ]; then
              echo "NeoForge (CurseForge)|${{ steps.publish_forge.outputs.curseforge-url }}|CURSEFORGE"
            fi

            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Discord notify
        run: ./gradlew publishToDiscord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MOD_CHANGELOG: ${{steps.build_changelog.outputs.changelog}}
